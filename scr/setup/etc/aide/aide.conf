# Advanced Intrusion Detection Environment (AIDE) configuration
# Based on production servers with 100% CIS Benchmark compliance
#
# Variables to replace before deployment:
# {{NUM_WORKERS}} - Number of parallel workers (default: 4, tune for your CPU)

# Database locations
database=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
database_new=file:/var/lib/aide/aide.db.new

# Gzip the database for reduced size
gzip_dbout=yes

# Report URL (where AIDE sends its reports)
report_url=stdout
;suppress inspection "DuplicateKeyInSection"
report_url=file:/var/log/aide/aide.log

# Performance tuning: Multi-threading support (AIDE v0.18+)
# Tune this based on your CPU cores (typically num_cores - 1)
num_workers={{ NUM_WORKERS }}

# AIDE Groups (Predefined patterns for different file types)
#
# FILE TYPES
#
# f:            restrict rule to regular files
# d:            restrict rule to directories
# l:            restrict rule to symbolic links
# c:            restrict rule to character devices
# b:            restrict rule to block devices
# p:            restrict rule to FIFO files
# s:            restrict rule to UNIX sockets
# D:            restrict rule to Solaris doors
# P:            restrict rule to Solaris event ports
#
# FILE ATTRIBUTES
#
# p:            permissions
# i:            inode
# l:            link name (symbolic link only)
# n:            number of links
# u:            user
# g:            group
# s:            size
# b:            block count
# m:            mtime
# a:            atime
# c:            ctime
# ftype:        file type
# fstype:       filesystem type
# acl:          Access Control Lists                        (requires libacl)
# selinux:      SELinux security context                    (requires libselinux)
# xattrs:       Extended file attributes                    (requires libattr)
# e2fsattrs:    ext2/3/4 attributes                         (requires libext2fs)
# caps:         Linux file capabilities                     (requires libcap)
#
# SPECIAL ATTRIBUTES
#
# I:            Ignore changed filename                     (see docs @ https://www.mankier.com/5/aide.conf#Attributes-I)
# growing:      Ignore growing files (e.g. logs)            (see docs @ https://www.mankier.com/5/aide.conf#Attributes-growing)
# compressed:   Ignore compressed files (e.g. databases)    (see docs @ https://www.mankier.com/5/aide.conf#Attributes-compressed)
# ANF:          Allow new files                             (see docs @ https://www.mankier.com/5/aide.conf#Attributes-ANF)
# ARF:          Allow removed files                         (see docs @ https://www.mankier.com/5/aide.conf#Attributes-ARF)
#
# HASHSUMS ATTRIBUTES
#
# sha256:       sha256 checksum
# sha512:       sha512 checksum
# sha512_256:   sha512 checksum truncated to 256 bits
# sha3_256:     sha3-256 checksum
# sha3_512:     sha3-512 checksum
# stribog256:   GOST R 34.11-2012, 256 bit checksum
# stribog512:   GOST R 34.11-2012, 512 bit checksum
#
# DEFAULT GROUPS
#
# Use 'aide --version' to list default compound groups available in your AIDE version
#
# R:            p+ftype+i+l+n+u+g+s+m+c+sha3_256+X
# L:            p+ftype+i+l+n+u+g+X
# >:            p+ftype+l+u+g+i+n+s+growing+X               (Growing file)
# H:            All compiled in hashsums (e.g. sha256+sha512)
# X:            acl+selinux+xattrs+e2fsattrs+caps           (if compiled in)
# E:            Empty group
#
# EXAMPLES
#
# / R           Adds all files on your machine to the database.  This one line is a fully qualified configuration file.
# !/dev$        Excludes all files in /dev from the database (e.g. device files that change frequently).
# =/foo R       Only /foo and /foobar are added to the database.  None of their children are added.
# =/foo/ R      Only /foo and its children are added to the database.  The children of subdirectories (/foo/dir/bar) are not added.
# / d,f R       Only directories and regular files are added to the database.  Symbolic links, device files, etc. are not added.
# !/run d
# /run R        Add all but directory entries to the database.
# /run d R-m-c-i
# /run R        Use a specific rule for directories
#
# SUGGESTED GROUPS
#
# Best Practice 2025: Use modern hash algorithms (SHA256 + SHA512)
# Old algorithms (MD5, SHA1) are deprecated due to collision attacks
Checksums=sha256+sha512
# OwnerMode = Only ownership and permissions
# OwnerMode = p+u+g+acl+selinux
OwnerMode = p+u+g+ftype
# Size = Check size and block count
Size = s+b
# InodeData = Check inode, number of links, and file type
InodeData = OwnerMode+n+i+Size+l+X
# StaticFile = Integrity of static files (e.g. system binaries, config files)
StaticFile = m+c+Checksums
# Full = Complete integrity checking for immutable files
# Full = OwnerMode+n+l+X+acl+selinux+xattrs+sha256+sha512
Full = ftype+p+l+u+g+s+m+c+a+i+b+n+H+X
# Files that change mtime or ctime but not contents
# VarTime = Full-m
VarTime = InodeData+Checksums
# VarInode = Like Full, but ignores inode number (for files that can be recreated)
VarInode = VarTime-i
# VarFile = Only metadata, ignores content changes (for files with dynamic content)
VarFile = OwnerMode+n+l+X
# VarDir = For directories where content changes but structure should be monitored
VarDir = OwnerMode+n+i+X
# RecreatedDir = For directories that are often recreated and change contents (e.g. /tmp)
RecreatedDir = OwnerMode+n+X
# LANANA = Linux Assigned Names And Numbers Authority (device files)
LANANA = p+u+g+acl+selinux
#
# DEFAULT LOG HANDLING
#
# AIDE v0.18+ Log Groups (Best Practice 2025)
ActLog = Full+growing+ANF+I         # Active logs (allowed to grow)
RotLog = Full                       # Rotated logs (size can change)
CompSerLog = Full+I+compressed      # Compressed logs (gzip)
MidlSerLog = Full+I                 # Mid-level logs (e.g. rotated but not compressed)
LastSerLog = Full+ARF+I             # Last logs (removed after rotation)

# ============================================
# AIDE Rules (What to monitor)
# ============================================
# System binaries and libraries (immutable)
/bin Full
/sbin Full
/usr/bin Full
/usr/sbin Full
/usr/local/bin Full
/usr/local/sbin Full
/lib Full
/lib64 Full
/usr/lib Full
/usr/lib64 Full
# Boot files (kernel, initramfs)
/boot Full
# Configuration files
/etc Full
# Root home directory
/root Full
# Log directories (use ActLog/RotLog instead of Full)
/var/log ActLog
# Variable data directories
/var/spool VarDir
/var/mail VarDir

# ============================================
# Standard Excludes (Virtual filesystems, temporary data)
# ============================================
# Virtual filesystems (never monitor these)
!/proc
!/sys
!/dev
!/run
!/tmp
!/var/tmp
# systemd runtime
!/run/systemd
# container runtimes (if not monitoring container filesystems themselves)
!/var/lib/lxc/
!/var/lib/lxd/
# Package manager cache (changes on every apt update)
!/var/cache/apt
!/var/lib/apt/lists
!/var/lib/dpkg/info
!/snap/
!/var/snap/
!/var/lib/snapd/
!/run/snapd/
# ============================================
# AIDE Database Itself
# ============================================
# Don't monitor AIDE's own files (would cause circular updates)
!/var/lib/aide
!/var/log/aide

# ============================================
# Drop-in Configuration Support
# ============================================
# Include additional rules from {{DROPIN_DIR}}
# Files with executable bit set are executed and their output included
# This allows service-specific excludes (Docker, PostgreSQL, Nextcloud, etc.)
@@x_include /etc/aide/aide.conf.d ^[a-zA-Z0-9_-]+$


